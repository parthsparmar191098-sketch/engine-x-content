<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="38" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Hydrostatic test: fill, vent, pressurise, hold</text>
  <text x="400" y="62" text-anchor="middle" fill="#8fc4ff" font-size="14">ASME B31.3 piping: ≈ 1.5 × design pressure, hold ≥ 10 min</text>

  <!-- Piping layout -->
  <rect x="16" y="82" width="440" height="360" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <path d="M60,330 L160,330 L160,150 L330,150 L330,300 L420,300" fill="none" stroke="#5ea7ff" stroke-width="12" stroke-linejoin="round"/>
  <rect x="414" y="286" width="10" height="28" fill="#8a6cff"/>
  <text x="419" y="332" text-anchor="middle" fill="#8a6cff" font-size="11">blind</text>
  <!-- vent -->
  <line x1="245" y1="144" x2="245" y2="112" stroke="#eaf1ff" stroke-width="3"/>
  <path d="M237,112 L253,112 L245,102 Z" fill="#eaf1ff"/>
  <text x="262" y="112" fill="#eaf1ff" font-size="12">High-point vent</text>
  <text x="262" y="128" fill="#8fc4ff" font-size="11">open until no air</text>
  <!-- gauges -->
  <circle cx="190" cy="120" r="14" fill="none" stroke="#eaf1ff" stroke-width="2.5"/><line x1="190" y1="120" x2="198" y2="112" stroke="#8a6cff" stroke-width="2"/>
  <line x1="190" y1="134" x2="190" y2="144" stroke="#eaf1ff" stroke-width="2"/>
  <text x="172" y="106" text-anchor="end" fill="#eaf1ff" font-size="11">Gauge (top)</text>
  <circle cx="110" cy="370" r="14" fill="none" stroke="#eaf1ff" stroke-width="2.5"/><line x1="110" y1="370" x2="118" y2="362" stroke="#8a6cff" stroke-width="2"/>
  <line x1="110" y1="336" x2="110" y2="356" stroke="#eaf1ff" stroke-width="2"/>
  <text x="132" y="388" fill="#eaf1ff" font-size="11">Gauge (bottom)</text>
  <!-- pump -->
  <rect x="26" y="310" width="34" height="40" rx="4" fill="none" stroke="#8a6cff" stroke-width="2.5"/>
  <text x="43" y="368" text-anchor="middle" fill="#8a6cff" font-size="11">pump</text>
  <text x="66" y="300" fill="#8fc4ff" font-size="11">fill from lowest point</text>
  <path d="M120,322 L150,322" stroke="#5ea7ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="236" y="230" text-anchor="middle" fill="#8fc4ff" font-size="12">Static head: +≈3 bar</text>
  <text x="236" y="246" text-anchor="middle" fill="#8fc4ff" font-size="12">per 30 m height</text>
  <text x="236" y="420" text-anchor="middle" fill="#eaf1ff" font-size="12">Inspect welds, flanges, threads, packings</text>

  <!-- Pressure chart -->
  <rect x="470" y="82" width="314" height="360" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="627" y="110" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">Pressure vs time</text>
  <line x1="510" y1="370" x2="760" y2="370" stroke="#8fc4ff" stroke-width="1.5"/>
  <line x1="510" y1="370" x2="510" y2="130" stroke="#8fc4ff" stroke-width="1.5"/>
  <path d="M510,370 L530,320 L555,320 L570,275 L595,275 L610,230 L635,230 L650,170 L715,170 L725,250 L760,250" fill="none" stroke="#5ea7ff" stroke-width="3"/>
  <line x1="510" y1="170" x2="760" y2="170" stroke="#8a6cff" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="510" y1="250" x2="760" y2="250" stroke="#8a6cff" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="518" y="164" fill="#8a6cff" font-size="11">Test ≈ 1.5 × design</text>
  <text x="518" y="244" fill="#8a6cff" font-size="11">Design</text>
  <text x="682" y="160" text-anchor="middle" fill="#eaf1ff" font-size="11">hold</text>
  <text x="742" y="240" text-anchor="middle" fill="#eaf1ff" font-size="11">inspect</text>
  <text x="610" y="356" text-anchor="middle" fill="#8fc4ff" font-size="11">25 → 50 → 75 → 100 %</text>
  <text x="635" y="392" text-anchor="middle" fill="#8fc4ff" font-size="12">time →</text>
  <text x="627" y="420" text-anchor="middle" fill="#eaf1ff" font-size="12">Pass: no leak, no unexplained drop</text>
</svg>
