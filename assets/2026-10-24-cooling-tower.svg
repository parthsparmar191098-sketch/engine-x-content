<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6cff"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eaf1ff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="36" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">How a cooling tower works</text>
  <text x="400" y="58" text-anchor="middle" fill="#8fc4ff" font-size="14">Induced-draft counterflow · cooling by evaporation</text>

  <!-- Tower body -->
  <rect x="120" y="110" width="280" height="300" fill="#111b30" stroke="#8fc4ff" stroke-width="2.5"/>
  <!-- Fan stack -->
  <path d="M200,110 L215,78 L305,78 L320,110" fill="#111b30" stroke="#8fc4ff" stroke-width="2.5"/>
  <line x1="225" y1="96" x2="295" y2="96" stroke="#eaf1ff" stroke-width="4"/>
  <circle cx="260" cy="96" r="4" fill="#eaf1ff"/>
  <text x="330" y="100" fill="#eaf1ff" font-size="12">Fan</text>
  <path d="M245,74 L245,64" stroke="#8a6cff" stroke-width="2.5" marker-end="url(#av)"/>
  <path d="M275,74 L275,64" stroke="#8a6cff" stroke-width="2.5" marker-end="url(#av)"/>
  <text x="330" y="74" fill="#8a6cff" font-size="12">warm moist air out</text>

  <!-- Drift eliminators -->
  <g stroke="#8fc4ff" stroke-width="2"><path d="M130,128 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8"/></g>
  <text x="410" y="136" fill="#8fc4ff" font-size="12">Drift eliminators</text>

  <!-- Spray header -->
  <line x1="40" y1="160" x2="390" y2="160" stroke="#8a6cff" stroke-width="5"/>
  <g fill="#8a6cff"><circle cx="160" cy="170" r="3"/><circle cx="210" cy="170" r="3"/><circle cx="260" cy="170" r="3"/><circle cx="310" cy="170" r="3"/><circle cx="360" cy="170" r="3"/></g>
  <text x="20" y="136" fill="#8a6cff" font-size="12">Hot water in</text><text x="20" y="150" fill="#8a6cff" font-size="12">42 °C</text>
  <text x="410" y="166" fill="#eaf1ff" font-size="12">Spray nozzles</text>

  <!-- Fill -->
  <rect x="130" y="190" width="260" height="110" fill="#16365f" opacity="0.6"/>
  <g stroke="#5ea7ff" stroke-width="1.5"><line x1="150" y1="192" x2="150" y2="298"/><line x1="175" y1="192" x2="175" y2="298"/><line x1="200" y1="192" x2="200" y2="298"/><line x1="225" y1="192" x2="225" y2="298"/><line x1="250" y1="192" x2="250" y2="298"/><line x1="275" y1="192" x2="275" y2="298"/><line x1="300" y1="192" x2="300" y2="298"/><line x1="325" y1="192" x2="325" y2="298"/><line x1="350" y1="192" x2="350" y2="298"/><line x1="375" y1="192" x2="375" y2="298"/></g>
  <text x="410" y="236" fill="#eaf1ff" font-size="12">Fill: water spreads</text>
  <text x="410" y="252" fill="#eaf1ff" font-size="12">into thin films</text>
  <path d="M260,196 L260,292" stroke="#5ea7ff" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ab)"/>

  <!-- Air inlets -->
  <path d="M70,330 L150,330 L190,286" fill="none" stroke="#eaf1ff" stroke-width="2.5" marker-end="url(#aw)"/>
  <path d="M450,330 L370,330 L330,286" fill="none" stroke="#eaf1ff" stroke-width="2.5" marker-end="url(#aw)"/>
  <text x="66" y="350" fill="#eaf1ff" font-size="12">Air in</text>
  <text x="414" y="350" fill="#eaf1ff" font-size="12">Air in</text>

  <!-- Basin -->
  <rect x="120" y="370" width="280" height="40" fill="#16365f"/>
  <text x="260" y="395" text-anchor="middle" fill="#eaf1ff" font-size="12">Cold water basin 32 °C</text>
  <path d="M400,395 L460,395" stroke="#5ea7ff" stroke-width="4" marker-end="url(#ab)"/>
  <text x="120" y="430" fill="#8fc4ff" font-size="11">make-up in · blowdown out</text>

  <!-- Numbers panel -->
  <rect x="540" y="200" width="244" height="210" rx="10" fill="#111b30" stroke="#5ea7ff" stroke-width="2"/>
  <text x="662" y="226" text-anchor="middle" fill="#eaf1ff" font-size="14" font-weight="700">Example</text>
  <text x="556" y="254" fill="#eaf1ff" font-size="13">Hot in</text><text x="768" y="254" text-anchor="end" fill="#8a6cff" font-size="13">42 °C</text>
  <text x="556" y="278" fill="#eaf1ff" font-size="13">Cold out</text><text x="768" y="278" text-anchor="end" fill="#5ea7ff" font-size="13">32 °C</text>
  <text x="556" y="302" fill="#eaf1ff" font-size="13">Wet bulb</text><text x="768" y="302" text-anchor="end" fill="#8fc4ff" font-size="13">27 °C</text>
  <line x1="556" y1="314" x2="768" y2="314" stroke="#2a3a5c"/>
  <text x="556" y="338" fill="#eaf1ff" font-size="13" font-weight="700">Range</text><text x="768" y="338" text-anchor="end" fill="#eaf1ff" font-size="13" font-weight="700">10 °C</text>
  <text x="556" y="362" fill="#eaf1ff" font-size="13" font-weight="700">Approach</text><text x="768" y="362" text-anchor="end" fill="#eaf1ff" font-size="13" font-weight="700">5 °C</text>
  <text x="662" y="394" text-anchor="middle" fill="#8fc4ff" font-size="11">≈1% evaporates per 5.6 °C range</text>
</svg>
