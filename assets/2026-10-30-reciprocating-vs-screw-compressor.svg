<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="40" fill="#eaf1ff" font-size="22" font-weight="700" text-anchor="middle">Reciprocating vs rotary screw air compressor</text>
  <text x="400" y="64" fill="#8fc4ff" font-size="13" text-anchor="middle">Both trap air and shrink its volume. One works in pulses, one runs continuously.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8fc4ff"/></marker></defs>
  <!-- piston side -->
  <rect x="30" y="86" width="355" height="350" rx="14" fill="none" stroke="#5ea7ff" stroke-opacity="0.5"/>
  <text x="207" y="114" fill="#5ea7ff" font-size="16" font-weight="700" text-anchor="middle">Reciprocating (piston)</text>
  <rect x="152" y="134" width="110" height="20" fill="none" stroke="#eaf1ff" stroke-width="2"/>
  <path d="M168 134 l0 -10 M246 134 l0 -10" stroke="#eaf1ff" stroke-width="2"/>
  <text x="128" y="128" fill="#8fc4ff" font-size="12" text-anchor="end">suction</text>
  <text x="270" y="128" fill="#8fc4ff" font-size="12">delivery</text>
  <path d="M152 154 L152 270 M262 154 L262 270" stroke="#eaf1ff" stroke-width="3"/>
  <rect x="156" y="200" width="102" height="34" rx="3" fill="#5ea7ff" fill-opacity="0.25" stroke="#5ea7ff" stroke-width="2"/>
  <text x="207" y="222" fill="#eaf1ff" font-size="12" text-anchor="middle">piston</text>
  <line x1="207" y1="234" x2="190" y2="300" stroke="#8a6cff" stroke-width="5"/>
  <circle cx="207" cy="310" r="26" fill="none" stroke="#8a6cff" stroke-width="3"/>
  <circle cx="190" cy="300" r="5" fill="#8a6cff"/>
  <path d="M290 230 L290 180" stroke="#8fc4ff" stroke-width="2" marker-end="url(#a)"/>
  <path d="M310 180 L310 230" stroke="#8fc4ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="250" fill="#8fc4ff" font-size="12" text-anchor="middle">up / down</text>
  <text x="207" y="362" fill="#eaf1ff" font-size="14" text-anchor="middle">Duty cycle about 60–80%: must rest</text>
  <text x="207" y="384" fill="#eaf1ff" font-size="13" text-anchor="middle">Runs about 150–200 °C, loud</text>
  <text x="207" y="406" fill="#8fc4ff" font-size="12" text-anchor="middle">Cheap, simple repairs, high pressure</text>
  <!-- screw side -->
  <rect x="415" y="86" width="355" height="350" rx="14" fill="none" stroke="#8a6cff" stroke-opacity="0.6"/>
  <text x="592" y="114" fill="#8a6cff" font-size="16" font-weight="700" text-anchor="middle">Rotary screw</text>
  <rect x="470" y="150" width="244" height="130" rx="18" fill="none" stroke="#eaf1ff" stroke-width="2"/>
  <rect x="482" y="160" width="220" height="50" rx="25" fill="#5ea7ff" fill-opacity="0.18" stroke="#5ea7ff" stroke-width="2"/>
  <path d="M500 160 q14 25 0 50 M530 160 q14 25 0 50 M560 160 q14 25 0 50 M590 160 q14 25 0 50 M620 160 q14 25 0 50 M650 160 q14 25 0 50 M680 160 q14 25 0 50" stroke="#5ea7ff" stroke-width="2" fill="none"/>
  <rect x="482" y="220" width="220" height="50" rx="25" fill="#8a6cff" fill-opacity="0.18" stroke="#8a6cff" stroke-width="2"/>
  <path d="M500 220 q-14 25 0 50 M530 220 q-14 25 0 50 M560 220 q-14 25 0 50 M590 220 q-14 25 0 50 M620 220 q-14 25 0 50 M650 220 q-14 25 0 50 M680 220 q-14 25 0 50" stroke="#8a6cff" stroke-width="2" fill="none"/>
  <text x="592" y="302" fill="#8fc4ff" font-size="12" text-anchor="middle">air trapped between lobes, volume shrinks</text>
  <path d="M480 322 L700 322" stroke="#8fc4ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="476" y="342" fill="#8fc4ff" font-size="12">intake</text>
  <text x="708" y="342" fill="#8fc4ff" font-size="12" text-anchor="end">discharge</text>
  <text x="592" y="372" fill="#eaf1ff" font-size="14" text-anchor="middle">Duty cycle 100%: runs all day</text>
  <text x="592" y="394" fill="#eaf1ff" font-size="13" text-anchor="middle">Runs about 80–99 °C, quieter</text>
  <text x="592" y="416" fill="#8fc4ff" font-size="12" text-anchor="middle">Costs more, smooth steady airflow</text>
</svg>
