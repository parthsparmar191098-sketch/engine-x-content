<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="38" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Ship propulsion: two-stroke vs four-stroke</text>
  <text x="400" y="62" text-anchor="middle" fill="#8fc4ff" font-size="14">Slow engine = direct drive · fast engine = gearbox</text>

  <!-- Two-stroke row -->
  <rect x="20" y="82" width="760" height="170" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="40" y="108" fill="#eaf1ff" font-size="15" font-weight="700">Two-stroke, low speed (~80–120 rpm)</text>
  <rect x="60" y="122" width="150" height="110" rx="6" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <rect x="90" y="132" width="34" height="22" fill="#5ea7ff" fill-opacity="0.5"/>
  <rect x="146" y="132" width="34" height="22" fill="#5ea7ff" fill-opacity="0.5"/>
  <line x1="107" y1="154" x2="107" y2="190" stroke="#eaf1ff" stroke-width="3"/>
  <line x1="163" y1="154" x2="163" y2="190" stroke="#eaf1ff" stroke-width="3"/>
  <rect x="99" y="186" width="16" height="10" fill="#8a6cff"/><rect x="155" y="186" width="16" height="10" fill="#8a6cff"/>
  <text x="135" y="222" text-anchor="middle" fill="#8fc4ff" font-size="11">crossheads</text>
  <line x1="210" y1="200" x2="560" y2="200" stroke="#eaf1ff" stroke-width="4"/>
  <text x="385" y="190" text-anchor="middle" fill="#8fc4ff" font-size="13">one shaft, no gearbox</text>
  <ellipse cx="590" cy="200" rx="14" ry="48" fill="none" stroke="#5ea7ff" stroke-width="3"/>
  <text x="566" y="150" text-anchor="end" fill="#eaf1ff" font-size="12">big, slow propeller →</text>
  <text x="640" y="196" fill="#8fc4ff" font-size="12">&gt; 50% thermal</text>
  <text x="640" y="214" fill="#8fc4ff" font-size="12">efficiency</text>
  <text x="640" y="232" fill="#8a6cff" font-size="12">Tankers, bulkers,</text>
  <text x="640" y="246" fill="#8a6cff" font-size="12">container ships</text>

  <!-- Four-stroke row -->
  <rect x="20" y="270" width="760" height="170" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="40" y="296" fill="#eaf1ff" font-size="15" font-weight="700">Four-stroke, medium speed (~400–1,000 rpm)</text>
  <rect x="60" y="324" width="100" height="70" rx="6" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <text x="110" y="364" text-anchor="middle" fill="#eaf1ff" font-size="12">compact</text>
  <line x1="160" y1="368" x2="260" y2="368" stroke="#eaf1ff" stroke-width="4"/>
  <rect x="260" y="330" width="90" height="76" rx="6" fill="none" stroke="#8a6cff" stroke-width="2.5"/>
  <circle cx="290" cy="352" r="12" fill="none" stroke="#8a6cff" stroke-width="2"/>
  <circle cx="318" cy="378" r="20" fill="none" stroke="#8a6cff" stroke-width="2"/>
  <text x="305" y="424" text-anchor="middle" fill="#8a6cff" font-size="12">reduction gearbox</text>
  <line x1="350" y1="378" x2="560" y2="378" stroke="#eaf1ff" stroke-width="4"/>
  <ellipse cx="590" cy="378" rx="12" ry="36" fill="none" stroke="#5ea7ff" stroke-width="3"/>
  <text x="640" y="362" fill="#8fc4ff" font-size="12">Often diesel-electric,</text>
  <text x="640" y="380" fill="#8fc4ff" font-size="12">several engines</text>
  <text x="640" y="410" fill="#8a6cff" font-size="12">Ferries, cruise,</text>
  <text x="640" y="424" fill="#8a6cff" font-size="12">offshore, generators</text>
</svg>
