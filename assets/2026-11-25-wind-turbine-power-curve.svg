<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, Arial, sans-serif">
<rect width="800" height="440" fill="#0a1120"/>
<text x="400" y="32" text-anchor="middle" fill="#eaf1ff" font-size="21" font-weight="700">Power curve of a 5 MW wind turbine (NREL 5 MW, 126 m rotor)</text>
<text x="400" y="54" text-anchor="middle" fill="#8fc4ff" font-size="13">Electrical power ≈ ½ × 1.225 × 12,469 m² × v³ × Cp 0.482 × 94.4 %, capped at 5 MW</text>
<!-- grid -->
<g stroke="#22314a" stroke-width="1">
<path d="M80 360 H740"/><path d="M80 313.3 H740"/><path d="M80 266.7 H740"/><path d="M80 220 H740"/><path d="M80 173.3 H740"/><path d="M80 126.7 H740"/><path d="M80 80 H740"/>
</g>
<path d="M80 80 V360 H740" fill="none" stroke="#8fa1bc" stroke-width="2"/>
<g fill="#8fa1bc" font-size="12" text-anchor="end">
<text x="72" y="364">0</text><text x="72" y="317">1</text><text x="72" y="271">2</text><text x="72" y="224">3</text><text x="72" y="177">4</text><text x="72" y="131">5</text><text x="72" y="84">6 MW</text>
</g>
<g fill="#8fa1bc" font-size="12" text-anchor="middle">
<text x="80" y="380">0</text><text x="206.9" y="380">5</text><text x="333.8" y="380">10</text><text x="460.8" y="380">15</text><text x="587.7" y="380">20</text><text x="714.6" y="380">25</text>
<text x="410" y="402">Wind speed at hub height (m/s)</text>
</g>
<!-- power in the wind -->
<path d="M156.2 350.4 L181.5 337.2 L206.9 315.4 L232.3 283.0 L257.7 237.8 L283.1 177.5 L298.3 133.3" fill="none" stroke="#8a6cff" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="258" y="190" fill="#8a6cff" font-size="13" text-anchor="end">power in the wind (v³)</text>
<!-- turbine output -->
<path d="M156.2 355.6 L181.5 349.6 L206.9 339.7 L232.3 325.0 L257.7 304.4 L283.1 277.0 L308.5 241.8 L333.8 197.8 L359.2 144.2 L369.4 126.7 L714.6 126.7 L714.6 360" fill="none" stroke="#2fb27a" stroke-width="4" stroke-linejoin="round"/>
<g font-size="12.5">
<line x1="156.2" y1="360" x2="156.2" y2="368" stroke="#eaf1ff"/><text x="156" y="352" fill="#eaf1ff" text-anchor="middle" dy="-16">cut-in 3</text>
<line x1="369.4" y1="126.7" x2="369.4" y2="360" stroke="#d9a21b" stroke-dasharray="3 4"/><text x="376" y="330" fill="#d9a21b">rated 11.4 m/s</text>
<text x="540" y="118" fill="#2fb27a" text-anchor="middle">5 MW: blades pitch to hold power</text>
<text x="706" y="250" fill="#e2571f" text-anchor="end">cut-out 25 m/s:</text><text x="706" y="266" fill="#e2571f" text-anchor="end">blades feather, rotor stops</text>
<circle cx="283.1" cy="277" r="5" fill="#2fb27a"/><text x="392" y="250" fill="#2fb27a">8 m/s → 1.8 MW</text><path d="M388 252 L290 275" stroke="#2fb27a" stroke-width="1" stroke-dasharray="2 3"/>
</g>
<text x="400" y="428" text-anchor="middle" fill="#8fa1bc" font-size="13">Twice the wind speed, eight times the power, until the turbine hits its rating</text>
</svg>
