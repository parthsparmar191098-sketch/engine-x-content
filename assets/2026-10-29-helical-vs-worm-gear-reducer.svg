<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="40" fill="#eaf1ff" font-size="22" font-weight="700" text-anchor="middle">Helical vs worm gear reducer</text>
  <text x="400" y="64" fill="#8fc4ff" font-size="13" text-anchor="middle">Same job (slow the motor, raise the torque), very different losses</text>
  <!-- helical side -->
  <rect x="30" y="86" width="355" height="340" rx="14" fill="none" stroke="#5ea7ff" stroke-opacity="0.5"/>
  <text x="207" y="114" fill="#5ea7ff" font-size="16" font-weight="700" text-anchor="middle">Two-stage helical (in-line)</text>
  <circle cx="95" cy="200" r="22" fill="none" stroke="#eaf1ff" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="183" cy="200" r="66" fill="none" stroke="#eaf1ff" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="183" cy="200" r="24" fill="none" stroke="#8a6cff" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="290" cy="200" r="83" fill="none" stroke="#8a6cff" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="95" y="205" fill="#eaf1ff" font-size="12" text-anchor="middle">18</text>
  <text x="183" y="150" fill="#eaf1ff" font-size="12" text-anchor="middle">72</text>
  <text x="183" y="205" fill="#eaf1ff" font-size="12" text-anchor="middle">19</text>
  <text x="300" y="150" fill="#eaf1ff" font-size="12" text-anchor="middle">76</text>
  <text x="95" y="250" fill="#8fc4ff" font-size="12" text-anchor="middle">1440 rpm</text>
  <text x="183" y="292" fill="#8fc4ff" font-size="12" text-anchor="middle">360 rpm</text>
  <text x="300" y="300" fill="#8fc4ff" font-size="12" text-anchor="middle">90 rpm</text>
  <text x="207" y="340" fill="#eaf1ff" font-size="14" text-anchor="middle">Teeth mostly roll: 95–98% efficient</text>
  <text x="207" y="362" fill="#eaf1ff" font-size="13" text-anchor="middle">4 : 1 × 4 : 1 = 16 : 1, parallel shafts</text>
  <text x="207" y="384" fill="#8fc4ff" font-size="12" text-anchor="middle">Axial thrust → tapered roller bearings</text>
  <text x="207" y="406" fill="#8fc4ff" font-size="12" text-anchor="middle">Can be back-driven by the load</text>
  <!-- worm side -->
  <rect x="415" y="86" width="355" height="340" rx="14" fill="none" stroke="#8a6cff" stroke-opacity="0.6"/>
  <text x="592" y="114" fill="#8a6cff" font-size="16" font-weight="700" text-anchor="middle">Single-stage worm (right angle)</text>
  <circle cx="592" cy="215" r="78" fill="none" stroke="#eaf1ff" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="470" y="282" width="244" height="30" rx="15" fill="none" stroke="#5ea7ff" stroke-width="3"/>
  <path d="M490 282 l12 30 M514 282 l12 30 M538 282 l12 30 M562 282 l12 30 M586 282 l12 30 M610 282 l12 30 M634 282 l12 30 M658 282 l12 30 M682 282 l12 30" stroke="#5ea7ff" stroke-width="2"/>
  <text x="592" y="220" fill="#eaf1ff" font-size="12" text-anchor="middle">worm wheel</text>
  <text x="730" y="301" fill="#8fc4ff" font-size="12">worm</text>
  <text x="592" y="340" fill="#eaf1ff" font-size="14" text-anchor="middle">Thread slides on teeth: ~49–90%</text>
  <text x="592" y="362" fill="#eaf1ff" font-size="13" text-anchor="middle">5 : 1 to 300 : 1, shafts at 90°</text>
  <text x="592" y="384" fill="#8fc4ff" font-size="12" text-anchor="middle">Efficiency falls as the ratio rises</text>
  <text x="592" y="406" fill="#8fc4ff" font-size="12" text-anchor="middle">Often hard for the load to back-drive</text>
</svg>
