<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="36" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Three welding processes, five ways to inspect</text>
  <text x="400" y="58" text-anchor="middle" fill="#8fc4ff" font-size="14">How the weld pool is shielded · which NDT sees which defect</text>

  <!-- Process panels -->
  <g>
    <rect x="16" y="76" width="248" height="200" rx="12" fill="#111b30" stroke="#2a3a5c"/>
    <text x="140" y="100" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">Stick (SMAW)</text>
    <rect x="132" y="112" width="16" height="78" fill="#8a6cff" opacity="0.5"/><rect x="137" y="112" width="6" height="88" fill="#eaf1ff"/>
    <text x="156" y="140" fill="#8fc4ff" font-size="11">flux-coated rod</text>
    <ellipse cx="140" cy="212" rx="34" ry="8" fill="#5ea7ff" opacity="0.6"/>
    <rect x="60" y="218" width="160" height="10" fill="#2a3a5c"/>
    <text x="140" y="250" text-anchor="middle" fill="#eaf1ff" font-size="12">Flux → gas + slag</text>
    <text x="140" y="268" text-anchor="middle" fill="#8a6cff" font-size="11">Outdoor, field repair</text>
  </g>
  <g>
    <rect x="276" y="76" width="248" height="200" rx="12" fill="#111b30" stroke="#2a3a5c"/>
    <text x="400" y="100" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">MIG (GMAW)</text>
    <path d="M380,112 L420,112 L410,190 L390,190 Z" fill="none" stroke="#8fc4ff" stroke-width="2"/>
    <line x1="400" y1="112" x2="400" y2="204" stroke="#eaf1ff" stroke-width="2"/>
    <path d="M388,192 L372,206 M412,192 L428,206" stroke="#5ea7ff" stroke-width="2"/>
    <text x="428" y="140" fill="#8fc4ff" font-size="11">wire + gas</text>
    <ellipse cx="400" cy="212" rx="34" ry="8" fill="#5ea7ff" opacity="0.6"/>
    <rect x="320" y="218" width="160" height="10" fill="#2a3a5c"/>
    <text x="400" y="250" text-anchor="middle" fill="#eaf1ff" font-size="12">Gas shield, no slag</text>
    <text x="400" y="268" text-anchor="middle" fill="#8a6cff" font-size="11">Fast shop work, still air</text>
  </g>
  <g>
    <rect x="536" y="76" width="248" height="200" rx="12" fill="#111b30" stroke="#2a3a5c"/>
    <text x="660" y="100" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">TIG (GTAW)</text>
    <path d="M640,112 L680,112 L670,186 L650,186 Z" fill="none" stroke="#8fc4ff" stroke-width="2"/>
    <line x1="660" y1="150" x2="660" y2="200" stroke="#8a6cff" stroke-width="3"/>
    <line x1="720" y1="150" x2="680" y2="206" stroke="#eaf1ff" stroke-width="2"/>
    <text x="586" y="150" fill="#8fc4ff" font-size="11">tungsten</text>
    <text x="700" y="146" fill="#8fc4ff" font-size="11">filler rod</text>
    <ellipse cx="660" cy="212" rx="34" ry="8" fill="#5ea7ff" opacity="0.6"/>
    <rect x="580" y="218" width="160" height="10" fill="#2a3a5c"/>
    <text x="660" y="250" text-anchor="middle" fill="#eaf1ff" font-size="12">Inert gas, separate filler</text>
    <text x="660" y="268" text-anchor="middle" fill="#8a6cff" font-size="11">Precise, thin, stainless roots</text>
  </g>

  <!-- NDT depth chart -->
  <rect x="16" y="290" width="768" height="156" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="36" y="314" fill="#eaf1ff" font-size="14" font-weight="700">NDT: what each method sees</text>
  <rect x="300" y="326" width="460" height="104" fill="#16365f" opacity="0.5"/>
  <line x1="300" y1="326" x2="760" y2="326" stroke="#eaf1ff" stroke-width="2"/>
  <text x="290" y="331" text-anchor="end" fill="#8fc4ff" font-size="11">surface</text>
  <text x="290" y="428" text-anchor="end" fill="#8fc4ff" font-size="11">inside</text>
  <g font-size="12" fill="#eaf1ff">
    <rect x="320" y="318" width="60" height="16" rx="3" fill="#5ea7ff"/><text x="350" y="330" text-anchor="middle" fill="#0a1120" font-weight="700">VT</text>
    <rect x="400" y="318" width="60" height="16" rx="3" fill="#5ea7ff"/><text x="430" y="330" text-anchor="middle" fill="#0a1120" font-weight="700">PT</text>
    <rect x="480" y="318" width="60" height="34" rx="3" fill="#8a6cff"/><text x="510" y="340" text-anchor="middle" fill="#0a1120" font-weight="700">MT</text>
    <rect x="560" y="326" width="60" height="104" rx="3" fill="#5ea7ff" opacity="0.85"/><text x="590" y="382" text-anchor="middle" fill="#0a1120" font-weight="700">RT</text>
    <rect x="640" y="340" width="60" height="90" rx="3" fill="#8a6cff" opacity="0.85"/><text x="670" y="390" text-anchor="middle" fill="#0a1120" font-weight="700">UT</text>
  </g>
  <text x="36" y="350" fill="#eaf1ff" font-size="12">VT  Visual — always first</text>
  <text x="36" y="370" fill="#eaf1ff" font-size="12">PT  Penetrant — surface cracks</text>
  <text x="36" y="390" fill="#eaf1ff" font-size="12">MT  Magnetic — ferromagnetic only</text>
  <text x="36" y="410" fill="#eaf1ff" font-size="12">RT  Radiography — through the weld</text>
  <text x="36" y="430" fill="#eaf1ff" font-size="12">UT  Ultrasonic — depth &amp; size</text>
</svg>
