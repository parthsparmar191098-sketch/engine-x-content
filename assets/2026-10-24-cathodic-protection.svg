<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6cff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="36" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Cathodic protection: make the hull the cathode</text>
  <text x="400" y="58" text-anchor="middle" fill="#8fc4ff" font-size="14">Something else corrodes, or a controller supplies the current</text>

  <!-- Sacrificial -->
  <rect x="16" y="76" width="376" height="366" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="204" y="102" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Sacrificial anodes</text>
  <rect x="30" y="170" width="348" height="190" fill="#16365f" opacity="0.6"/>
  <text x="44" y="352" fill="#8fc4ff" font-size="12">sea water (electrolyte)</text>
  <path d="M40,150 L370,150 L370,200 Q370,250 300,262 L110,262 Q40,250 40,200 Z" fill="#2a3a5c" stroke="#eaf1ff" stroke-width="2.5"/>
  <text x="204" y="208" text-anchor="middle" fill="#eaf1ff" font-size="14" font-weight="700">Steel hull = cathode</text>
  <rect x="120" y="262" width="34" height="14" fill="#8a6cff"/><rect x="250" y="262" width="34" height="14" fill="#8a6cff"/>
  <text x="204" y="300" text-anchor="middle" fill="#8a6cff" font-size="12">Zinc / aluminium anodes corrode</text>
  <path d="M137,262 L137,236" stroke="#5ea7ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M267,262 L267,236" stroke="#5ea7ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="300" y="244" fill="#5ea7ff" font-size="11">e⁻ to hull</text>
  <text x="204" y="384" text-anchor="middle" fill="#eaf1ff" font-size="12">No power · output fixed by size</text>
  <text x="204" y="404" text-anchor="middle" fill="#eaf1ff" font-size="12">Renew in dry dock</text>
  <text x="204" y="428" text-anchor="middle" fill="#8fc4ff" font-size="11">Al ≈ 2,759 A·h/kg · Zn ≈ 812 A·h/kg</text>

  <!-- ICCP -->
  <rect x="408" y="76" width="376" height="366" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="596" y="102" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Impressed current (ICCP)</text>
  <rect x="422" y="170" width="348" height="190" fill="#16365f" opacity="0.6"/>
  <path d="M432,150 L762,150 L762,200 Q762,250 692,262 L502,262 Q432,250 432,200 Z" fill="#2a3a5c" stroke="#eaf1ff" stroke-width="2.5"/>
  <rect x="540" y="116" width="112" height="28" rx="6" fill="#111b30" stroke="#5ea7ff" stroke-width="2"/>
  <text x="596" y="135" text-anchor="middle" fill="#eaf1ff" font-size="12">Controller + DC</text>
  <rect x="500" y="262" width="40" height="8" fill="#eaf1ff"/>
  <text x="520" y="288" text-anchor="middle" fill="#eaf1ff" font-size="11">inert anode</text>
  <circle cx="680" cy="266" r="7" fill="#8a6cff"/>
  <text x="680" y="290" text-anchor="middle" fill="#8a6cff" font-size="11">reference electrode</text>
  <path d="M560,144 L520,262" stroke="#5ea7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M632,144 L680,259" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M520,300 Q560,340 610,272" fill="none" stroke="#5ea7ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="596" y="208" text-anchor="middle" fill="#eaf1ff" font-size="14" font-weight="700">Steel hull = cathode</text>
  <text x="560" y="346" fill="#5ea7ff" font-size="11">current through water</text>
  <text x="596" y="384" text-anchor="middle" fill="#eaf1ff" font-size="12">Auto-adjusts to water conditions</text>
  <text x="596" y="404" text-anchor="middle" fill="#eaf1ff" font-size="12">Anodes not consumed</text>
  <text x="596" y="428" text-anchor="middle" fill="#8fc4ff" font-size="11">Design life ≈ 15–20 years</text>
</svg>
