<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="38" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Three ways to carry a turning shaft</text>
  <text x="400" y="62" text-anchor="middle" fill="#8fc4ff" font-size="14">Point contact · line contact · oil film</text>

  <!-- Ball -->
  <rect x="16" y="82" width="248" height="346" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="140" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Ball bearing</text>
  <circle cx="140" cy="200" r="72" fill="none" stroke="#8fc4ff" stroke-width="3"/>
  <circle cx="140" cy="200" r="40" fill="none" stroke="#8fc4ff" stroke-width="3"/>
  <circle cx="140" cy="200" r="22" fill="#2a3a5c"/>
  <g fill="#5ea7ff"><circle cx="140" cy="144" r="13"/><circle cx="196" cy="200" r="13"/><circle cx="140" cy="256" r="13"/><circle cx="84" cy="200" r="13"/><circle cx="180" cy="160" r="13"/><circle cx="100" cy="240" r="13"/><circle cx="180" cy="240" r="13"/><circle cx="100" cy="160" r="13"/></g>
  <text x="140" y="304" text-anchor="middle" fill="#8a6cff" font-size="13">Point contact</text>
  <text x="140" y="334" text-anchor="middle" fill="#eaf1ff" font-size="13">Low friction, high speed</text>
  <text x="140" y="356" text-anchor="middle" fill="#eaf1ff" font-size="13">Moderate load</text>
  <text x="140" y="404" text-anchor="middle" fill="#8fc4ff" font-size="12">Motors, fans, small pumps</text>

  <!-- Roller -->
  <rect x="276" y="82" width="248" height="346" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="400" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Roller bearing</text>
  <circle cx="400" cy="200" r="72" fill="none" stroke="#8fc4ff" stroke-width="3"/>
  <circle cx="400" cy="200" r="40" fill="none" stroke="#8fc4ff" stroke-width="3"/>
  <circle cx="400" cy="200" r="22" fill="#2a3a5c"/>
  <g fill="#5ea7ff">
    <rect x="390" y="130" width="20" height="28" rx="3"/><rect x="390" y="242" width="20" height="28" rx="3"/>
    <rect x="330" y="190" width="28" height="20" rx="3"/><rect x="442" y="190" width="28" height="20" rx="3"/>
    <rect x="430" y="150" width="20" height="26" rx="3" transform="rotate(45 440 163)"/><rect x="350" y="224" width="20" height="26" rx="3" transform="rotate(45 360 237)"/>
    <rect x="430" y="224" width="20" height="26" rx="3" transform="rotate(-45 440 237)"/><rect x="350" y="150" width="20" height="26" rx="3" transform="rotate(-45 360 163)"/>
  </g>
  <text x="400" y="304" text-anchor="middle" fill="#8a6cff" font-size="13">Line contact</text>
  <text x="400" y="334" text-anchor="middle" fill="#eaf1ff" font-size="13">Higher load, stiffer</text>
  <text x="400" y="356" text-anchor="middle" fill="#eaf1ff" font-size="13">Tapered / spherical: + axial</text>
  <text x="400" y="404" text-anchor="middle" fill="#8fc4ff" font-size="12">Gearboxes, hubs, conveyors</text>

  <!-- Journal -->
  <rect x="536" y="82" width="248" height="346" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="660" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Journal bearing</text>
  <circle cx="660" cy="200" r="72" fill="none" stroke="#8fc4ff" stroke-width="3"/>
  <circle cx="660" cy="200" r="64" fill="#8a6cff" fill-opacity="0.25"/>
  <circle cx="668" cy="210" r="56" fill="#2a3a5c" stroke="#eaf1ff" stroke-width="2"/>
  <path d="M640,158 A44,44 0 0 1 706,180" fill="none" stroke="#5ea7ff" stroke-width="2.5"/>
  <path d="M700,172 L707,182 L695,182" fill="#5ea7ff"/>
  <text x="668" y="214" text-anchor="middle" fill="#eaf1ff" font-size="12">shaft</text>
  <text x="604" y="150" text-anchor="end" fill="#8a6cff" font-size="11">oil</text>
  <text x="660" y="304" text-anchor="middle" fill="#8a6cff" font-size="13">Oil wedge lifts the shaft</text>
  <text x="660" y="334" text-anchor="middle" fill="#eaf1ff" font-size="13">No metal contact running</text>
  <text x="660" y="356" text-anchor="middle" fill="#eaf1ff" font-size="13">Wear happens at start-up</text>
  <text x="660" y="404" text-anchor="middle" fill="#8fc4ff" font-size="12">Big engines, turbines, turbos</text>

  <text x="400" y="452" text-anchor="middle" fill="#8fc4ff" font-size="12">Rolling bearing life: L10 = (C/P)^p million revs · p = 3 ball, 10/3 roller</text>
</svg>
