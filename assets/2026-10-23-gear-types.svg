<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="38" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Four gear types, chosen by shaft layout</text>
  <text x="400" y="62" text-anchor="middle" fill="#8fc4ff" font-size="14">Side views · dashed lines = shaft axes</text>

  <!-- Spur -->
  <rect x="16" y="82" width="182" height="360" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="107" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Spur</text>
  <rect x="44" y="140" width="50" height="110" rx="4" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <rect x="118" y="160" width="50" height="70" rx="4" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <g stroke="#5ea7ff" stroke-width="2"><line x1="52" y1="150" x2="52" y2="240"/><line x1="64" y1="150" x2="64" y2="240"/><line x1="76" y1="150" x2="76" y2="240"/><line x1="128" y1="168" x2="128" y2="222"/><line x1="142" y1="168" x2="142" y2="222"/><line x1="156" y1="168" x2="156" y2="222"/></g>
  <line x1="69" y1="128" x2="69" y2="262" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="143" y1="128" x2="143" y2="262" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="107" y="292" text-anchor="middle" fill="#8fc4ff" font-size="13">Parallel shafts</text>
  <text x="107" y="326" text-anchor="middle" fill="#eaf1ff" font-size="12">Straight teeth</text>
  <text x="107" y="346" text-anchor="middle" fill="#eaf1ff" font-size="12">No axial thrust</text>
  <text x="107" y="366" text-anchor="middle" fill="#eaf1ff" font-size="12">Loud at high speed</text>
  <text x="107" y="410" text-anchor="middle" fill="#8a6cff" font-size="12">Simple, low cost</text>

  <!-- Helical -->
  <rect x="210" y="82" width="182" height="360" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="301" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Helical</text>
  <rect x="238" y="140" width="50" height="110" rx="4" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <rect x="312" y="160" width="50" height="70" rx="4" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <g stroke="#5ea7ff" stroke-width="2"><line x1="242" y1="170" x2="262" y2="150"/><line x1="242" y1="200" x2="284" y2="158"/><line x1="242" y1="230" x2="284" y2="188"/><line x1="262" y1="240" x2="284" y2="218"/><line x1="316" y1="190" x2="340" y2="166"/><line x1="320" y1="220" x2="358" y2="182"/><line x1="342" y1="226" x2="358" y2="210"/></g>
  <line x1="263" y1="128" x2="263" y2="262" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="337" y1="128" x2="337" y2="262" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="301" y="292" text-anchor="middle" fill="#8fc4ff" font-size="13">Parallel shafts</text>
  <text x="301" y="326" text-anchor="middle" fill="#eaf1ff" font-size="12">Angled teeth</text>
  <text x="301" y="346" text-anchor="middle" fill="#eaf1ff" font-size="12">Quiet, more load</text>
  <text x="301" y="366" text-anchor="middle" fill="#eaf1ff" font-size="12">Axial thrust</text>
  <text x="301" y="410" text-anchor="middle" fill="#8a6cff" font-size="12">Needs thrust bearings</text>

  <!-- Bevel -->
  <rect x="404" y="82" width="182" height="360" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="495" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Bevel</text>
  <path d="M440,226 L500,226 L540,266 L400,266 Z" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <path d="M500,166 L500,226 L540,266 L540,126 Z" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <line x1="470" y1="130" x2="470" y2="276" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="420" y1="196" x2="572" y2="196" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="470" cy="196" r="3.5" fill="#8a6cff"/>
  <text x="495" y="296" text-anchor="middle" fill="#8fc4ff" font-size="13">Shafts meet (often 90°)</text>
  <text x="495" y="326" text-anchor="middle" fill="#eaf1ff" font-size="12">Cone-shaped gears</text>
  <text x="495" y="346" text-anchor="middle" fill="#eaf1ff" font-size="12">Spiral = quieter</text>
  <text x="495" y="366" text-anchor="middle" fill="#eaf1ff" font-size="12">Turns drive a corner</text>
  <text x="495" y="410" text-anchor="middle" fill="#8a6cff" font-size="12">e.g. differential</text>

  <!-- Worm -->
  <rect x="598" y="82" width="186" height="360" rx="12" fill="#111b30" stroke="#2a3a5c"/>
  <text x="691" y="110" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="700">Worm</text>
  <circle cx="691" cy="170" r="42" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <rect x="628" y="214" width="126" height="30" rx="8" fill="none" stroke="#8fc4ff" stroke-width="2.5"/>
  <g stroke="#5ea7ff" stroke-width="2"><line x1="642" y1="244" x2="654" y2="214"/><line x1="662" y1="244" x2="674" y2="214"/><line x1="682" y1="244" x2="694" y2="214"/><line x1="702" y1="244" x2="714" y2="214"/><line x1="722" y1="244" x2="734" y2="214"/></g>
  <line x1="612" y1="229" x2="770" y2="229" stroke="#8a6cff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="691" cy="170" r="4" fill="#8a6cff"/>
  <text x="691" y="292" text-anchor="middle" fill="#8fc4ff" font-size="13">Shafts cross at 90°</text>
  <text x="691" y="326" text-anchor="middle" fill="#eaf1ff" font-size="12">40 teeth ÷ 1 start = 40:1</text>
  <text x="691" y="346" text-anchor="middle" fill="#eaf1ff" font-size="12">Can self-lock</text>
  <text x="691" y="366" text-anchor="middle" fill="#eaf1ff" font-size="12">~30–90% efficient</text>
  <text x="691" y="410" text-anchor="middle" fill="#8a6cff" font-size="12">Big ratio, one stage</text>
</svg>
