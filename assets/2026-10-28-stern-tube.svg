<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="36" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">A ship's shaft line at the stern</text>
  <text x="400" y="58" text-anchor="middle" fill="#8fc4ff" font-size="14">Simplified section · aft (left) to forward (right)</text>

  <!-- Hull -->
  <path d="M150,90 L150,300 Q160,340 220,350 L780,350" fill="none" stroke="#8fc4ff" stroke-width="3"/>
  <rect x="20" y="300" width="130" height="140" fill="#16365f" opacity="0.4"/>
  <text x="30" y="430" fill="#8fc4ff" font-size="12">sea</text>
  <text x="700" y="380" fill="#8fc4ff" font-size="12">engine room →</text>

  <!-- Stern tube -->
  <rect x="150" y="196" width="330" height="48" fill="#111b30" stroke="#8fc4ff" stroke-width="2.5"/>
  <text x="315" y="190" text-anchor="middle" fill="#eaf1ff" font-size="13">Stern tube (oil-filled)</text>
  <!-- bearings -->
  <rect x="168" y="204" width="70" height="8" fill="#8a6cff"/><rect x="168" y="228" width="70" height="8" fill="#8a6cff"/>
  <rect x="400" y="204" width="50" height="8" fill="#8a6cff"/><rect x="400" y="228" width="50" height="8" fill="#8a6cff"/>
  <text x="203" y="268" text-anchor="middle" fill="#8a6cff" font-size="12">aft bearing</text>
  <text x="425" y="268" text-anchor="middle" fill="#8a6cff" font-size="12">fwd bearing</text>

  <!-- Shaft -->
  <rect x="96" y="212" width="680" height="16" fill="#2a3a5c" stroke="#eaf1ff" stroke-width="1.5"/>
  <text x="620" y="206" fill="#eaf1ff" font-size="12">tailshaft → engine</text>

  <!-- Seals -->
  <rect x="140" y="192" width="14" height="56" rx="3" fill="#5ea7ff"/>
  <rect x="476" y="192" width="14" height="56" rx="3" fill="#5ea7ff"/>
  <text x="147" y="290" text-anchor="middle" fill="#5ea7ff" font-size="12">aft seal</text>
  <text x="483" y="290" text-anchor="middle" fill="#5ea7ff" font-size="12">fwd seal</text>

  <!-- Propeller -->
  <path d="M70,200 L96,212 L96,228 L70,240 Z" fill="#2a3a5c" stroke="#eaf1ff" stroke-width="1.5"/>
  <ellipse cx="84" cy="150" rx="14" ry="55" fill="none" stroke="#eaf1ff" stroke-width="2.5"/>
  <ellipse cx="84" cy="290" rx="14" ry="55" fill="none" stroke="#eaf1ff" stroke-width="2.5"/>
  <text x="40" y="86" fill="#eaf1ff" font-size="12">propeller</text>

  <!-- Poker gauge -->
  <line x1="203" y1="120" x2="203" y2="210" stroke="#eaf1ff" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M203,150 L203,206" stroke="#5ea7ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="212" y="128" fill="#5ea7ff" font-size="12">poker gauge: wear-down</text>
  <text x="212" y="144" fill="#8fc4ff" font-size="11">trend vs earlier readings</text>

  <!-- Checks box -->
  <rect x="520" y="76" width="264" height="104" rx="10" fill="#111b30" stroke="#2a3a5c"/>
  <text x="534" y="98" fill="#eaf1ff" font-size="13" font-weight="700">In dry dock</text>
  <text x="534" y="120" fill="#8fc4ff" font-size="12">• Wear-down &amp; bearing clearance</text>
  <text x="534" y="138" fill="#8fc4ff" font-size="12">• Renew seals, check liner</text>
  <text x="534" y="156" fill="#8fc4ff" font-size="12">• MT/PT on taper &amp; keyway</text>
  <text x="534" y="174" fill="#8fc4ff" font-size="12">• Propeller inspect &amp; polish</text>

  <!-- Blade regions -->
  <rect x="240" y="370" width="420" height="70" rx="10" fill="#111b30" stroke="#2a3a5c"/>
  <text x="256" y="392" fill="#eaf1ff" font-size="13" font-weight="700">Blade regions</text>
  <text x="256" y="414" fill="#8a6cff" font-size="12">A: near hub — highest stress, most critical</text>
  <text x="256" y="432" fill="#8fc4ff" font-size="12">B: mid-radius — limited repair · C: tip — cavitation, most repairable</text>
</svg>
