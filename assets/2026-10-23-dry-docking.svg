<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6cff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="38" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Dry docking: landing a ship on keel blocks</text>
  <text x="400" y="62" text-anchor="middle" fill="#8fc4ff" font-size="14">Graving dock · side view · ship trimmed by the stern</text>

  <!-- Dock walls and floor -->
  <path d="M40,100 L40,380 L700,380 L700,100" fill="none" stroke="#8fc4ff" stroke-width="4"/>
  <rect x="700" y="100" width="14" height="280" fill="#2a3a5c"/>
  <text x="707" y="94" text-anchor="middle" fill="#8fc4ff" font-size="12">gate</text>

  <!-- Water (falling) -->
  <rect x="42" y="300" width="656" height="78" fill="#16365f" opacity="0.8"/>
  <line x1="42" y1="300" x2="698" y2="300" stroke="#5ea7ff" stroke-width="2"/>
  <text x="644" y="292" fill="#eaf1ff" font-size="12">pumped</text><text x="644" y="306" fill="#eaf1ff" font-size="12">out</text>
  <path d="M660,312 L660,360" stroke="#5ea7ff" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Keel blocks -->
  <g fill="#8a6cff">
    <rect x="130" y="358" width="22" height="22"/><rect x="190" y="358" width="22" height="22"/><rect x="250" y="358" width="22" height="22"/><rect x="310" y="358" width="22" height="22"/><rect x="370" y="358" width="22" height="22"/><rect x="430" y="358" width="22" height="22"/><rect x="490" y="358" width="22" height="22"/><rect x="550" y="358" width="22" height="22"/>
  </g>
  <text x="350" y="400" text-anchor="middle" fill="#8a6cff" font-size="12">keel blocks (steel with timber caps)</text>

  <!-- Ship hull, trimmed by stern (stern low on left) -->
  <path d="M100,200 L620,200 L660,212 L610,330 L150,358 L110,350 Z" fill="#111b30" stroke="#eaf1ff" stroke-width="2.5"/>
  <rect x="120" y="150" width="90" height="50" fill="#111b30" stroke="#eaf1ff" stroke-width="2"/>
  <text x="380" y="270" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">SHIP</text>
  <ellipse cx="86" cy="326" rx="8" ry="22" fill="none" stroke="#5ea7ff" stroke-width="2.5"/>
  <text x="86" y="292" text-anchor="middle" fill="#8fc4ff" font-size="11">prop</text>

  <!-- Upthrust at stern -->
  <path d="M141,420 L141,384" stroke="#8a6cff" stroke-width="3" marker-end="url(#av)"/>
  <text x="152" y="432" fill="#8a6cff" font-size="12">Upthrust P at stern</text>

  <!-- Critical period note -->
  <rect x="470" y="110" width="210" height="76" rx="8" fill="#111b30" stroke="#8a6cff" stroke-width="2"/>
  <text x="575" y="132" text-anchor="middle" fill="#eaf1ff" font-size="13" font-weight="700">Critical period</text>
  <text x="575" y="152" text-anchor="middle" fill="#8fc4ff" font-size="12">stern touches → whole keel</text>
  <text x="575" y="170" text-anchor="middle" fill="#8fc4ff" font-size="12">on blocks: GM is reduced</text>

  <!-- Steps -->
  <text x="40" y="452" fill="#eaf1ff" font-size="12">1 Enter &amp; align  ·  2 Close gate  ·  3 Pump slowly  ·  4 Stern lands  ·  5 Whole keel lands  ·  6 Pump dry (≈8–10 h)</text>
</svg>
