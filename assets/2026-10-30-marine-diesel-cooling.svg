<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="40" fill="#eaf1ff" font-size="22" font-weight="700" text-anchor="middle">Marine diesel cooling: two circuits</text>
  <text x="400" y="64" fill="#8fc4ff" font-size="13" text-anchor="middle">Fresh coolant stays inside the engine; sea water carries the heat overboard</text>
  <!-- engine -->
  <rect x="60" y="120" width="250" height="170" rx="16" fill="#1a2438" stroke="#ff7a5c" stroke-width="2"/>
  <text x="185" y="150" fill="#ff7a5c" font-size="15" font-weight="700" text-anchor="middle">Engine block &amp; heads</text>
  <text x="185" y="172" fill="#cfd9ec" font-size="12" text-anchor="middle">wet liners, oil cooler</text>
  <rect x="90" y="196" width="80" height="40" rx="8" fill="none" stroke="#ff7a5c"/>
  <text x="130" y="221" fill="#eaf1ff" font-size="12" text-anchor="middle">Coolant pump</text>
  <rect x="200" y="196" width="80" height="40" rx="8" fill="none" stroke="#ff7a5c"/>
  <text x="240" y="221" fill="#eaf1ff" font-size="12" text-anchor="middle">Thermostat</text>
  <!-- heat exchanger -->
  <rect x="430" y="140" width="250" height="110" rx="16" fill="#1a2438" stroke="#5ea7ff" stroke-width="2"/>
  <text x="555" y="168" fill="#eaf1ff" font-size="15" font-weight="700" text-anchor="middle">Heat exchanger</text>
  <line x1="460" y1="195" x2="650" y2="195" stroke="#5ea7ff" stroke-width="3"/>
  <line x1="460" y1="210" x2="650" y2="210" stroke="#5ea7ff" stroke-width="3"/>
  <line x1="460" y1="225" x2="650" y2="225" stroke="#5ea7ff" stroke-width="3"/>
  <text x="555" y="243" fill="#8fc4ff" font-size="11" text-anchor="middle">sea water in the tubes, coolant around them</text>
  <!-- fresh loop -->
  <path d="M310 180 C 370 150, 390 160, 430 170" fill="none" stroke="#ff7a5c" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M430 230 C 380 260, 360 270, 310 260" fill="none" stroke="#ffb199" stroke-width="4" marker-end="url(#ah2)"/>
  <text x="370" y="140" fill="#ff7a5c" font-size="12" text-anchor="middle">hot coolant</text>
  <text x="370" y="292" fill="#ffb199" font-size="12" text-anchor="middle">cooled coolant</text>
  <!-- sea water -->
  <rect x="430" y="330" width="120" height="50" rx="10" fill="none" stroke="#2fb27a" stroke-width="2"/>
  <text x="490" y="352" fill="#eaf1ff" font-size="12" text-anchor="middle">Sea water pump</text>
  <text x="490" y="368" fill="#8fc4ff" font-size="11" text-anchor="middle">rubber impeller</text>
  <rect x="260" y="330" width="120" height="50" rx="10" fill="none" stroke="#2fb27a" stroke-width="2"/>
  <text x="320" y="352" fill="#eaf1ff" font-size="12" text-anchor="middle">Seacock +</text>
  <text x="320" y="368" fill="#eaf1ff" font-size="12" text-anchor="middle">strainer</text>
  <rect x="610" y="330" width="150" height="50" rx="10" fill="none" stroke="#2fb27a" stroke-width="2"/>
  <text x="685" y="352" fill="#eaf1ff" font-size="12" text-anchor="middle">Exhaust elbow</text>
  <text x="685" y="368" fill="#8fc4ff" font-size="11" text-anchor="middle">then overboard</text>
  <path d="M380 355 L 425 355" stroke="#2fb27a" stroke-width="4" marker-end="url(#ah3)"/>
  <path d="M550 340 C 580 300, 560 270, 560 252" fill="none" stroke="#2fb27a" stroke-width="4" marker-end="url(#ah3)"/>
  <path d="M650 252 C 660 290, 680 300, 685 326" fill="none" stroke="#2fb27a" stroke-width="4" marker-end="url(#ah3)"/>
  <text x="190" y="360" fill="#2fb27a" font-size="13" font-weight="600" text-anchor="middle">Sea water in</text>
  <path d="M120 400 C 160 380, 200 370, 255 358" fill="none" stroke="#2fb27a" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="400" y="436" fill="#8fc4ff" font-size="12" text-anchor="middle">Overheating? Check the sea water side first: seacock, strainer, impeller, then heat exchanger tubes.</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff7a5c"/></marker>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffb199"/></marker>
    <marker id="ah3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2fb27a"/></marker>
  </defs>
</svg>
