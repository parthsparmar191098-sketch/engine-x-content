<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ea7ff"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6cff"/></marker>
  </defs>
  <rect width="800" height="460" fill="#0a1120"/>
  <text x="400" y="38" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Pump cavitation: NPSH available vs required</text>
  <text x="400" y="62" text-anchor="middle" fill="#8fc4ff" font-size="14">No cavitation only when NPSHa &gt; NPSHr + margin</text>

  <!-- Tank -->
  <rect x="40" y="300" width="200" height="130" rx="6" fill="#111b30" stroke="#eaf1ff" stroke-width="2"/>
  <rect x="42" y="330" width="196" height="98" fill="#16365f"/>
  <line x1="42" y1="330" x2="238" y2="330" stroke="#5ea7ff" stroke-width="2"/>
  <text x="140" y="390" text-anchor="middle" fill="#eaf1ff" font-size="14">Open tank</text>
  <text x="140" y="410" text-anchor="middle" fill="#8fc4ff" font-size="12">water level</text>
  <!-- Atmosphere arrows -->
  <path d="M100,268 L100,322" stroke="#5ea7ff" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M180,268 L180,322" stroke="#5ea7ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="140" y="260" text-anchor="middle" fill="#5ea7ff" font-size="13">Atmosphere ≈ 10.3 m water</text>

  <!-- Suction pipe -->
  <path d="M210,400 L290,400 L290,180 L360,180" stroke="#5ea7ff" stroke-width="10" fill="none" stroke-linejoin="round"/>
  <text x="304" y="350" fill="#8fc4ff" font-size="12">− friction</text>

  <!-- Suction lift dimension -->
  <line x1="270" y1="180" x2="270" y2="330" stroke="#8a6cff" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="304" y="240" fill="#8a6cff" font-size="12">− suction</text>
  <text x="304" y="256" fill="#8a6cff" font-size="12">lift</text>

  <!-- Pump -->
  <circle cx="420" cy="180" r="58" fill="#111b30" stroke="#eaf1ff" stroke-width="2"/>
  <circle cx="420" cy="180" r="14" fill="#0a1120" stroke="#5ea7ff" stroke-width="2"/>
  <g stroke="#8fc4ff" stroke-width="3">
    <path d="M420,166 Q440,140 455,140" fill="none"/>
    <path d="M434,180 Q460,200 460,215" fill="none"/>
    <path d="M420,194 Q400,220 385,220" fill="none"/>
    <path d="M406,180 Q380,160 380,145" fill="none"/>
  </g>
  <path d="M470,150 L540,120" stroke="#5ea7ff" stroke-width="10"/>
  <text x="560" y="116" fill="#8fc4ff" font-size="12">discharge</text>
  <text x="420" y="262" text-anchor="middle" fill="#eaf1ff" font-size="14" font-weight="700">Pump</text>

  <!-- Bubble callout -->
  <circle cx="414" cy="172" r="3" fill="#8a6cff"/><circle cx="426" cy="186" r="2.5" fill="#8a6cff"/><circle cx="410" cy="188" r="2" fill="#8a6cff"/>
  <path d="M440,92 L424,160" stroke="#8a6cff" stroke-width="2" marker-end="url(#av)"/>
  <text x="440" y="86" text-anchor="middle" fill="#8a6cff" font-size="13">Impeller eye: lowest pressure, bubbles form</text>

  <!-- Formula box -->
  <rect x="520" y="200" width="250" height="200" rx="10" fill="#111b30" stroke="#5ea7ff" stroke-width="2"/>
  <text x="645" y="226" text-anchor="middle" fill="#eaf1ff" font-size="15" font-weight="700">NPSHa (example)</text>
  <text x="540" y="254" fill="#eaf1ff" font-size="13">Atmosphere</text><text x="750" y="254" text-anchor="end" fill="#5ea7ff" font-size="13">+10.35 m</text>
  <text x="540" y="278" fill="#eaf1ff" font-size="13">Suction lift</text><text x="750" y="278" text-anchor="end" fill="#8a6cff" font-size="13">−3.00 m</text>
  <text x="540" y="302" fill="#eaf1ff" font-size="13">Friction</text><text x="750" y="302" text-anchor="end" fill="#8a6cff" font-size="13">−1.00 m</text>
  <text x="540" y="326" fill="#eaf1ff" font-size="13">Vapour (~20 °C)</text><text x="750" y="326" text-anchor="end" fill="#8a6cff" font-size="13">−0.24 m</text>
  <line x1="540" y1="338" x2="750" y2="338" stroke="#8fc4ff" stroke-width="1"/>
  <text x="540" y="360" fill="#eaf1ff" font-size="14" font-weight="700">NPSHa</text><text x="750" y="360" text-anchor="end" fill="#eaf1ff" font-size="14" font-weight="700">≈ 6.1 m</text>
  <text x="645" y="386" text-anchor="middle" fill="#8fc4ff" font-size="12">vs NPSH3 4.0 m → margin ≈ 2.1 m ✓</text>
</svg>
