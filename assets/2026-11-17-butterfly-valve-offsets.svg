<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif">
<rect width="800" height="460" fill="#0a1120"/>
<text x="400" y="34" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Concentric, double offset, triple offset</text>
<text x="400" y="56" text-anchor="middle" fill="#8fc4ff" font-size="14">Side section through the disc and seat · flow left to right · ● = stem</text>
<g font-size="13">
<rect x="20" y="76" width="244" height="300" rx="10" fill="#111b30" stroke="#2a3a5c"/>
<rect x="278" y="76" width="244" height="300" rx="10" fill="#111b30" stroke="#2a3a5c"/>
<rect x="536" y="76" width="244" height="300" rx="10" fill="#111b30" stroke="#2a3a5c"/>
<text x="142" y="102" text-anchor="middle" fill="#eaf1ff" font-weight="700">Concentric (zero offset)</text>
<text x="400" y="102" text-anchor="middle" fill="#eaf1ff" font-weight="700">Double offset</text>
<text x="658" y="102" text-anchor="middle" fill="#eaf1ff" font-weight="700">Triple offset</text>
</g>
<!-- pipe walls -->
<g stroke="#5a6a86" stroke-width="4">
<line x1="36" y1="130" x2="248" y2="130"/><line x1="36" y1="330" x2="248" y2="330"/>
<line x1="294" y1="130" x2="506" y2="130"/><line x1="294" y1="330" x2="506" y2="330"/>
<line x1="552" y1="130" x2="764" y2="130"/><line x1="552" y1="330" x2="764" y2="330"/>
</g>
<!-- concentric: rubber seat, disc centred on stem -->
<rect x="130" y="132" width="24" height="16" fill="#2fb27a"/><rect x="130" y="312" width="24" height="16" fill="#2fb27a"/>
<rect x="136" y="148" width="12" height="164" rx="5" fill="#e2571f"/>
<circle cx="142" cy="230" r="7" fill="#eaf1ff"/>
<text x="142" y="352" text-anchor="middle" fill="#2fb27a" font-size="12">rubber seat, stem in the disc</text>
<!-- double offset: stem behind seat and below centre -->
<rect x="384" y="132" width="20" height="16" fill="#2fb27a"/><rect x="384" y="312" width="20" height="16" fill="#2fb27a"/>
<rect x="388" y="148" width="12" height="164" rx="5" fill="#e2571f"/>
<rect x="400" y="214" width="18" height="40" fill="#e2571f"/>
<circle cx="414" cy="244" r="7" fill="#eaf1ff"/>
<line x1="394" y1="230" x2="414" y2="230" stroke="#ffb86b" stroke-dasharray="3 3"/>
<line x1="414" y1="230" x2="414" y2="244" stroke="#ffb86b" stroke-dasharray="3 3"/>
<text x="400" y="352" text-anchor="middle" fill="#ffb86b" font-size="12">stem behind the seat and off centre</text>
<!-- triple offset: conical metal seat -->
<polygon points="640,132 668,132 660,152 646,152" fill="#b8bec6"/><polygon points="646,308 660,308 668,328 640,328" fill="#b8bec6"/>
<polygon points="646,152 660,152 660,308 646,308" fill="#e2571f"/>
<rect x="660" y="214" width="18" height="40" fill="#e2571f"/>
<circle cx="674" cy="244" r="7" fill="#eaf1ff"/>
<text x="658" y="352" text-anchor="middle" fill="#b8bec6" font-size="12">cone-shaped metal seat</text>
<text x="142" y="404" text-anchor="middle" fill="#eaf1ff" font-size="13">Water, HVAC · ≤ Class 150</text>
<text x="400" y="404" text-anchor="middle" fill="#eaf1ff" font-size="13">Process · Class 150–300</text>
<text x="658" y="404" text-anchor="middle" fill="#eaf1ff" font-size="13">Steam, hydrocarbons · to Class 900+</text>
<text x="400" y="434" text-anchor="middle" fill="#8fa1bc" font-size="13">Each offset lifts the disc away from the seat sooner, so it rubs less</text>
</svg>
