<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, Arial, sans-serif">
<rect width="800" height="440" fill="#0a1120"/>
<text x="400" y="34" text-anchor="middle" fill="#eaf1ff" font-size="22" font-weight="700">Star to start, delta to run</text>
<text x="400" y="56" text-anchor="middle" fill="#8fc4ff" font-size="14">7.5 kW 4-pole motor · 400 V Δ / 690 V Y · 400 V supply</text>
<!-- star -->
<text x="200" y="96" text-anchor="middle" fill="#2fb27a" font-size="17" font-weight="700">STAR (start)</text>
<g stroke="#2fb27a" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M200 205 L200 125"/><path d="M200 205 L131 245"/><path d="M200 205 L269 245"/>
</g>
<circle cx="200" cy="205" r="6" fill="#eaf1ff"/>
<g fill="#eaf1ff" font-size="13"><text x="208" y="122">L1</text><text x="104" y="262">L2</text><text x="276" y="262">L3</text></g>
<text x="214" y="170" fill="#eaf1ff" font-size="13">230 V</text>
<text x="200" y="296" text-anchor="middle" fill="#eaf1ff" font-size="13">each winding: 400 ÷ √3 = 230 V</text>
<!-- delta -->
<text x="600" y="96" text-anchor="middle" fill="#e2571f" font-size="17" font-weight="700">DELTA (run)</text>
<path d="M600 125 L510 250 L690 250 Z" stroke="#e2571f" stroke-width="5" fill="none" stroke-linejoin="round"/>
<g fill="#eaf1ff" font-size="13"><text x="608" y="122">L1</text><text x="484" y="262">L2</text><text x="696" y="262">L3</text></g>
<text x="662" y="184" fill="#eaf1ff" font-size="13">400 V</text>
<text x="600" y="296" text-anchor="middle" fill="#eaf1ff" font-size="13">each winding: full 400 V</text>
<!-- bars -->
<text x="60" y="336" fill="#8fa1bc" font-size="13">Starting current</text>
<rect x="200" y="324" width="100" height="16" fill="#2fb27a"/><text x="308" y="337" fill="#2fb27a" font-size="13">31 A in star</text>
<rect x="420" y="324" width="300" height="16" fill="#e2571f" opacity="0.8"/><text x="420" y="320" fill="#e2571f" font-size="12">93 A direct-on-line</text>
<text x="60" y="372" fill="#8fa1bc" font-size="13">Starting torque</text>
<rect x="200" y="360" width="100" height="16" fill="#2fb27a"/><text x="308" y="373" fill="#2fb27a" font-size="13">36 Nm in star</text>
<rect x="420" y="360" width="300" height="16" fill="#e2571f" opacity="0.8"/><text x="420" y="398" fill="#e2571f" font-size="12">109 Nm direct-on-line</text>
<text x="400" y="428" text-anchor="middle" fill="#8fa1bc" font-size="13">A third of the current, but also a third of the torque · switch to delta at ~75–80 % speed</text>
</svg>
