name: Build and publish blog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ping_all:
        description: "Ping every page to IndexNow (Bing / ChatGPT search)"
        type: boolean
        default: false
      urls:
        description: "Or ping these exact URLs (space separated)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After publishing, tell Bing/IndexNow which posts are new or changed.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ping IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          PING_ALL: ${{ inputs.ping_all }}
          URLS: ${{ inputs.urls }}
        run: |
          if [ -n "$URLS" ]; then
            python indexnow.py $URLS
          elif [ "$PING_ALL" = "true" ]; then
            python indexnow.py --all
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            python indexnow.py $(git diff --name-only "$BEFORE" HEAD -- posts/)
          else
            echo "No previous commit to compare; run the workflow by hand with ping_all to ping everything."
          fi
